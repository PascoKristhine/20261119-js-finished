<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ラインが動くボタン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="btn-container gold">
    <button class="btn-inner">✦ &nbsp; RESERVE NOW</button>
  </div>


  <div class="btn-container aurora">
    <button class="btn-inner">✧ &nbsp; VIEW COLLECTION</button>
  </div>


  <div class="btn-container-adv emerald">
    <button class="btn-inner-adv">❖ &nbsp; LEARN MORE</button>
    <svg class="btn-svg-adv">
      <rect class="btn-rect-adv" width="100%" height="100%" rx="30" />  
    </svg>
  </div>


  <div class="btn-container-adv rose">
    <button class="btn-inner-adv">❀ &nbsp; SPECIAL GIFT</button>
    <svg class="btn-svg-adv">
      <rect class="btn-rect-adv" width="100%" height="100%" rx="30" />  
    </svg>
  </div>


  <div class="btn-container-adv hover-silk">
    <button class="btn-inner-adv">◈ &nbsp; CONTACT US</button>
    <svg class="btn-svg-adv">
      <rect class="btn-rect-adv" width="100%" height="100%" rx="30" />  
    </svg>
  </div>

  <script src="script.js"></script>
</body>
</html>
